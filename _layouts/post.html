---
layout: default
---

<article class="post">
  <div class="container">
    <p class="structural">{{ page.date | date: "%d.%m.%Y" }}</p>
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="page-content">
      {{ content }}
    </div>
    <hr class="divider">
    <p class="back-link"><a href="/updates">← All updates</a></p>
  </div>
</article>
