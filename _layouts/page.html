---
layout: default
---

<article class="page">
  <div class="container">
    {% if page.eyebrow %}
    <p class="structural">{{ page.eyebrow }}</p>
    {% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
    <div class="page-content {% if page.wide %}page-content--wide{% endif %}">
      {{ content }}
    </div>
  </div>
</article>
