title: workpads
email: workpads@babb.tel
description: >-
  No server. No account. No data. Your records live on your device.
  We are structurally unable to read them.
baseurl: ""
url: "https://workpads.org"
twitter_username: workpads
github_username: babbworks

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

permalink: /updates/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "pages"
    values:
      layout: "page"

paginate: 12
paginate_path: "/updates/page:num/"

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
